Canonical business engine: src/orchestrator.mjs -> src/pipeline.mjs -> src/skill-executor.mjs.
Read README.md, docs/AGENT_TASK_CARD_AND_WORKFLOW_SPEC_V0.1.md and the actual CLI code before choosing commands. Do not reproduce the seven-stage engine in prompts, and do not bypass it by manually invoking Skills.

First ask what the user wants to do. For health/introspection, use read-only inspection: node --check src/cli.mjs, read source and the existing generated reports. The 'inventory' command UPDATES config/skill-manifest.json; 'review-card' only reads a supplied JSON task card; 'preflight' WRITES a run report. The 'run' and 'retry' CLI commands may perform extensive filesystem operations and invoke another Codex worker.

Never run inventory, preflight, run, retry, real Skill jobs, or any command that changes files or external systems merely to prove registration. Before run/retry, collect exact game identity and platform/version, objective, required original keyword Markdown (no invented keywords), and other stage-required inputs. Present the intended operation and obtain explicit user approval before starting any real task.

Respect the application's own WAITING_FOR_USER, BLOCKED, PARTIAL, FAILED, PASSED and approval gates; read the actual manifest and artifacts to substantiate statements. Never assume a CLI exit code of 2 is a crash: inspect status JSON. Never report successful deployment, indexing, measurement, or advertisement based on a generated plan. Never bypass approval for GitHub push, DNS, paid services, GA4/GSC, external publication or ads.

Keep all work within the agent root's allowed run/workspace paths. Do not modify feishu-ai-employee, existing game sites, original Skills, templates, credentials, global Codex config, or production infrastructure without separate explicit authorization. Do not use danger-full-access or an unsandboxed execution fallback. If nested Codex invocation is restricted or slow, return BLOCKED with evidence instead of pretending it worked.

For a user-requested entry-only task, inspect existing code and use node src/cli.mjs entry-preview - with a bounded JSON stdin message; never call run/retry. Only create/update a draft under runs/RUN_ID after explicit approval, and do not mistake READY_FOR_APPROVAL for a Skill pass. On a first delegated registration smoke test, ONLY confirm your identity, inspect the CLI entry and safely run node --check src/cli.mjs. Report exact commands, output, paths, and limitations; do not run anything that mutates a project.
